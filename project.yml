name: RedditJSON
options:
  bundleIdPrefix: com.proof
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: PTYK65EU6A
    CODE_SIGN_STYLE: Automatic
targets:
  RedditJSON:
    type: application
    platform: iOS
    sources:
      - path: RedditJSON
      - path: Shared/SharedExtensionSupport.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.proof.RedditJSON
        INFOPLIST_FILE: RedditJSON/Info.plist
        CODE_SIGN_ENTITLEMENTS: RedditJSON/RedditJSON.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    dependencies:
      - target: ThreadlineShare
        embed: true
      - target: ThreadlineWidgets
        embed: true
  ThreadlineShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared/SharedExtensionSupport.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.proof.RedditJSON.ShareExtension
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        SKIP_INSTALL: YES
  ThreadlineWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetExtension
      - path: Shared/SharedExtensionSupport.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.proof.RedditJSON.WidgetExtension
        INFOPLIST_FILE: WidgetExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: WidgetExtension/WidgetExtension.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  RedditJSON:
    build:
      targets:
        RedditJSON: all
        ThreadlineShare: all
        ThreadlineWidgets: all
    run:
      config: Debug
    archive:
      config: Release
